<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="英文複習">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>11月英文複習</title>
<style>
/* 版面：單欄卡片、iPad 大按鈕；答錯一律用柔和琥珀色，不用紅色；不載入任何外部資源 */
:root{
  --bg:#e8f1f7; --surface:#ffffff; --surface-2:#f2f7fb; --ink:#1d2b3a; --muted:#5b6b7c; --line:#cdd9e3;
  --accent:#f5b62e; --accent-ink:#3a2a00; --tens:#11857a; --plum:#7a58b0;
  --good:#1f8a4c; --good-bg:#e1f4e8; --soft:#a8650a; --soft-bg:#fff4dc; --hint:#2f6db3; --hint-bg:#e6f0fb;
  --display:"Arial Rounded MT Bold","Avenir Next","Trebuchet MS",sans-serif;
  --body:"Avenir Next","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#13202c; --surface:#1c2c3b; --surface-2:#233647; --ink:#eaf2f8; --muted:#a3b4c4; --line:#34495c;
  --accent:#f5b62e; --accent-ink:#2a1e00; --tens:#4cc7b9; --plum:#b79bea;
  --good:#5fd08f; --good-bg:#183b29; --soft:#f2b35c; --soft-bg:#3b2e17; --hint:#8cbcf2; --hint-bg:#1d3149; color-scheme:dark}}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.5;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px 40px;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-weight:600;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(28px,5vw,40px)}
h2{font-size:26px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.nav{display:flex;gap:8px}
.navbtn{padding:10px 16px;border-radius:999px;background:var(--surface);border:2px solid var(--line);font-weight:700;font-size:16px;min-height:48px}
.navbtn[aria-current="true"]{border-color:var(--ink)}
.card{background:var(--surface);border-radius:24px;padding:24px;border:2px solid var(--line)}
.muted{color:var(--muted)}
.small{font-size:15px}

/* 單元切換 */
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:520px){.tabs{grid-template-columns:1fr}}
.unitbtn{min-height:64px;padding:8px 12px;border-radius:18px;background:var(--surface-2);border:3px solid var(--line);
  font-family:var(--display);font-weight:600;font-size:20px;line-height:1.2}
.unitbtn small{display:block;font-family:var(--body);font-weight:400;font-size:14px;color:var(--muted)}
.unitbtn[aria-selected="true"]{border-color:var(--ink);background:var(--surface);box-shadow:0 4px 0 var(--ink)}

/* 首頁 */
.mode{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--line)}
.mode:first-child{border-top:0;padding-top:4px}
.mode-info{min-width:0}
.mode h3{font-size:22px}
.badge{display:inline-block;padding:2px 10px;border-radius:10px;font-size:15px;vertical-align:middle;margin-right:6px;color:var(--surface)}
.dots{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);background:var(--surface-2)}
.dot.ok{background:var(--good);border-color:var(--good)}
.dot.fix{background:var(--good-bg);border-color:var(--good)}
.dot.no{background:var(--soft);border-color:var(--soft)}
.big{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 28px;border-radius:20px;
  background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:600;font-size:22px;box-shadow:0 5px 0 rgba(0,0,0,.22)}
.big:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.big[disabled]{opacity:.45;box-shadow:none}
.big.teal{background:var(--tens);color:var(--surface)}
.big.plum{background:var(--plum);color:var(--surface)}
.big.blue{background:var(--hint);color:var(--surface)}
.ghost{min-height:56px;padding:0 22px;border-radius:16px;border:2px solid var(--line);background:var(--surface);font-weight:700}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.center{justify-content:center}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-top:8px}
.pair{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;border-radius:12px;background:var(--surface-2);font-size:18px;text-align:left}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:var(--surface-2);font-size:18px;text-align:left}
.sline{display:block;width:100%;text-align:left;padding:8px 14px;margin-top:6px;border-radius:12px;background:var(--surface-2);font-size:19px}
.notes h3{margin-top:18px}
.notes h3:first-child{margin-top:0}
.notes p{margin:6px 0 0}
.s{color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:0 6px}

/* 題目 */
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px}
.progress{flex:1;height:14px;border-radius:7px;background:var(--surface-2);overflow:hidden;border:2px solid var(--line)}
.progress>i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qtype{font-size:15px;font-weight:700;color:var(--muted);letter-spacing:.04em}
.stars{color:var(--accent);font-size:22px;letter-spacing:2px;min-width:1ch}
.qbody{display:flex;flex-direction:column;gap:18px;margin-top:16px}
.prompt{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;padding:8px 0 4px}
.sentence{font-family:var(--display);font-size:clamp(26px,5vw,34px);font-weight:500}
.sentence.sbig{font-size:clamp(34px,7vw,48px)}
.given{color:var(--muted)}
.blank{display:inline-block;min-width:110px;border-bottom:4px solid var(--ink);margin:0 6px}
.zh{font-size:18px;color:var(--muted)}
.zhbig{font-family:var(--display);font-size:clamp(34px,8vw,52px);font-weight:600;line-height:1.2}
.emoji{font-size:72px;line-height:1}
.cue{display:inline-block;padding:6px 16px;border-radius:999px;background:var(--hint-bg);border:2px solid var(--hint);font-size:18px;font-weight:700}
.speak{display:inline-flex;align-items:center;gap:8px;min-height:52px;padding:0 20px;border-radius:999px;background:var(--surface-2);border:2px solid var(--line);font-weight:700}
.speak svg{width:24px;height:24px}

.slots{min-height:72px;display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px;border-radius:18px;border:3px dashed var(--line);background:var(--surface-2)}
.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.tile{min-width:56px;height:60px;padding:0 14px;border-radius:14px;background:var(--surface);border:3px solid var(--ink);
  font-family:var(--body);font-size:28px;font-weight:700;box-shadow:0 4px 0 var(--ink)}
.tile:active{transform:translateY(2px);box-shadow:0 2px 0 var(--ink)}
.tile[disabled]{opacity:.2;box-shadow:none}
.tile.word{font-size:24px;font-family:var(--display);font-weight:500}
.slots .tile{box-shadow:none;border-color:var(--accent);background:var(--surface)}
.placeholder{align-self:center;color:var(--muted);font-size:16px}

.options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.options.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.options.one{grid-template-columns:1fr}
@media (max-width:560px){.options,.options.three{grid-template-columns:1fr}}
.opt{min-height:72px;padding:10px 16px;border-radius:18px;background:var(--surface);border:3px solid var(--line);font-family:var(--display);font-size:26px;font-weight:500;text-align:center}
.opt:active{border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--soft);background:var(--soft-bg)}
.opt[disabled]{cursor:default}

/* 找錯 */
.findline{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:2px;font-family:var(--display);font-size:clamp(26px,5vw,36px)}
.tok{padding:6px 10px;border-radius:12px;border:3px dashed var(--line);background:var(--surface);min-height:64px}
.tok.tight{padding:6px 6px;min-width:36px}
.tok.gap{margin-left:12px}
.tok.right{border:3px solid var(--good);background:var(--good-bg)}
.tok.wrong{border:3px solid var(--soft);background:var(--soft-bg)}

/* 挖空拼字 */
.gapline{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-end;gap:6px;font-family:var(--body);font-size:32px;font-weight:700}
.cell{min-width:44px;height:60px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px;padding:0 4px}
.cell.given{min-width:22px;padding:0 1px;color:var(--ink)}
.cell.blank{border:3px dashed var(--muted);background:var(--surface-2);cursor:pointer;margin:0}
.cell.filled{border:3px solid var(--accent);background:var(--surface)}
.cell.word{color:var(--muted);font-family:var(--display);font-weight:500}
.spacer{width:18px}

.paperbox{border-radius:18px;padding:18px;border:3px dashed var(--line);background:var(--surface-2);text-align:center;color:var(--muted)}
.hintcard{border-radius:18px;padding:14px 18px;background:var(--hint-bg);border:3px solid var(--hint);display:flex;flex-direction:column;gap:8px}
.hintcard b{color:var(--hint);font-family:var(--display);font-size:22px}
.nudge{border-radius:18px;padding:16px;background:var(--hint-bg);color:var(--ink);text-align:center;font-family:var(--display);font-size:24px;border:3px solid var(--hint)}
.feedback{border-radius:20px;padding:18px 20px;display:flex;flex-direction:column;gap:8px}
.feedback.ok{background:var(--good-bg);border:3px solid var(--good)}
.feedback.no{background:var(--soft-bg);border:3px solid var(--soft)}
.feedback h3{font-size:26px}
.fb-answer{font-family:var(--display);font-size:30px;font-weight:600}
.starline{font-family:var(--display);font-size:22px;color:var(--accent-ink);background:var(--accent);border-radius:12px;padding:6px 12px;align-self:flex-start}

/* 錯題 */
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:14px;color:var(--muted);letter-spacing:.04em}
.tablewrap{overflow-x:auto}
.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.pill.open{background:var(--soft-bg);color:var(--soft)}
.pill.fixed{background:var(--good-bg);color:var(--good)}
.stats{display:flex;flex-wrap:wrap;gap:10px}
.stat{padding:10px 14px;border-radius:14px;background:var(--surface-2);font-size:15px}
.stat b{font-family:var(--display);font-size:22px;margin-left:6px;font-variant-numeric:tabular-nums}

.toggle{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--line)}
.toggle input{width:30px;height:30px;accent-color:var(--tens);flex:none}
.confirm{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:12px;border-radius:14px;background:var(--soft-bg)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.pop{animation:pop .35s ease}
@keyframes pop{0%{transform:scale(.97)}60%{transform:scale(1.01)}100%{transform:scale(1)}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <h1>11月英文複習</h1>
    <nav class="nav">
      <button class="navbtn" id="nav-home" aria-current="true">練習</button>
      <button class="navbtn" id="nav-errors">錯題</button>
      <button class="navbtn" id="nav-settings">設定</button>
    </nav>
  </header>

  <!-- HOME -->
  <section id="home" class="card">
    <div class="tabs" id="unit-tabs" role="tablist" aria-label="選擇進度"></div>
    <div id="modes"></div>
  </section>
  <section id="home-notes" class="card notes"></section>

  <!-- QUIZ -->
  <section id="quiz" class="card" hidden>
    <div class="qhead">
      <span class="qtype" id="q-type"></span>
      <div class="progress" aria-hidden="true"><i id="q-bar"></i></div>
      <span class="stars" id="q-stars" aria-label="星星"></span>
      <span class="small muted" id="q-count"></span>
    </div>
    <div id="q-body" class="qbody"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="card" hidden>
    <h2 id="r-title"></h2>
    <p class="muted" id="r-sub"></p>
    <div class="dots" id="r-dots"></div>
    <div class="row" style="margin-top:16px">
      <button class="big" id="r-home">回首頁</button>
      <button class="ghost" id="r-again">再練一回</button>
    </div>
  </section>

  <!-- ERRORS -->
  <section id="errors" class="card" hidden>
    <h2>錯題紀錄</h2>
    <p class="small muted">第一次答錯的題目都會記下來，之後會再出現。答對就標成「已訂正」。紀錄存在這台 iPad 上。</p>
    <div class="stats" id="e-stats"></div>
    <div class="tablewrap" style="margin-top:16px">
      <table>
        <thead><tr><th>進度</th><th>題目</th><th>孩子第一次的答案</th><th>正確答案</th><th>錯幾次</th><th>狀態</th></tr></thead>
        <tbody id="e-body"></tbody>
      </table>
    </div>
    <p class="muted" id="e-empty" hidden>目前沒有錯題。</p>
    <div style="margin-top:16px" id="e-clear-zone"></div>
  </section>

  <!-- SETTINGS -->
  <section id="settings" class="card" hidden>
    <h2>家長設定</h2>
    <label class="toggle" for="s-rate">
      <span><b>放慢朗讀速度</b><br><span class="small muted">英文發音講慢一點</span></span>
      <input type="checkbox" id="s-rate" checked>
    </label>
    <div class="row" style="margin-top:16px">
      <button class="ghost" id="s-test">試聽發音</button>
      <button class="ghost" id="s-reset-day">重設今天的進度</button>
    </div>
  </section>
</div>

<script>
/* ===================== 設定（之後要調整改這裡） ===================== */
const ROUND = 5;          // 每回題數
const TOO_FAST = 2000;    // 少於這個毫秒數就按，視為亂按、不算分
const MAX_REVIEW = 2;     // 每回最多放幾題舊錯題
const KEY = {settings:'kid2_nov_settings', errors:'kid2_nov_errors', day:'kid2_nov_day', unit:'kid2_nov_unit'};
const MODE_KEYS = ['words','grammar','contr','paper'];
const MODE_INFO = {
  words:  {name:'單字',     badge:'先做', color:'--hint'},
  grammar:{name:'句型',     badge:'',     color:''},
  contr:  {name:'縮寫',     badge:'重點', color:'--plum'},
  paper:  {name:'紙上聽寫', badge:'像考試', color:'--tens'}
};

/* ===================== 題庫小工具 ===================== */
const art = w => /^[aeiou]/i.test(w) ? 'an' : 'a';
const G = (target, blanks, extra, o={}) => Object.assign({kind:'gap', target, blanks, extra}, o);
const apoGap = (target, o={}) => G(target, [target.indexOf("'")], [',','.','-'], Object.assign({zh:"補上缺的撇「'」", say:target}, o));
const paperItems = (words, sents, tipW) => words.map(x=>({kind:'paper', text:x.w, tip:x.tip}))
  .concat(sents.map(t=>({kind:'paper', text:t, tip:sentTip(t)})));
function sentTip(t){
  let s = "檢查：句首大寫、縮寫的撇「'」有沒有寫、句尾有標點（. 或 ?）。";
  if(/your|you're/i.test(t)) s += ' your = 你的，不是 you\'re。';
  if(/\bhis\b/i.test(t)) s += ' his = 他的，不是 he\'s。';
  if(/They're/.test(t)) s += " They're = They are，不是 Their。";
  if(/doesn't|don't/.test(t)) s += " doesn't / don't 後面用 have。";
  return s;
}
function wordBanks(list){
  const pool = list.map(x=>x.w);
  return {
    wZh:     list.map(x=>({kind:'zhword', zh:x.zh, e:x.e, a:x.w, pool, tip:x.tip})),
    wListen: list.map(x=>({kind:'listenword', a:x.w, pool, tip:x.tip})),
    wGap:    list.map(x=>G(x.w, x.gaps, x.extra, {zh:x.zh, e:x.e, say:x.w, tip:x.tip}))
  };
}
function contrBanks(entries, gaps, finds, fills){
  return {
    cShort: entries.map(e=>({kind:'fill', big:true, s:`${e.long} → ___`, a:e.short, bad:e.bs, say:e.short, tip:e.tip, pt:`縮短 ${e.long}`})),
    cLong:  entries.map(e=>({kind:'fill', big:true, s:`${e.short} = ___`, a:e.long, bad:e.bl, say:`${e.short}. ${e.long}.`, tip:e.tip, pt:`還原 ${e.short}`})),
    cGap:   gaps,
    cFind:  finds.map(f=>Object.assign({kind:'find'}, f)),
    cFill:  fills.map(f=>Object.assign({kind:'fill'}, f))
  };
}

/* ===================== 學校 Unit 3 ===================== */
const SCH_W = [
  {w:'pen',    zh:'原子筆',  e:'🖊️', gaps:[1],   extra:['a','i','o'], tip:'pen：p-e-n，中間是 e。'},
  {w:'pencil', zh:'鉛筆',    e:'✏️', gaps:[1,4], extra:['a','s','o'], tip:'pencil：p-e-n-c-i-l，c 念 s 的音，但要寫 c。'},
  {w:'marker', zh:'彩色筆',  gaps:[1,4], extra:['e','c','o'], tip:'marker：mark + er，k 後面接 er。'},
  {w:'eraser', zh:'橡皮擦',  gaps:[2,3], extra:['c','z','i'], tip:'eraser：e-r-a-s-e-r，中間是 s 不是 c。'},
  {w:'book',   zh:'書',      e:'📖', gaps:[1,2], extra:['u','a','c'], tip:'book：b-oo-k，中間兩個 o。'},
  {w:'ruler',  zh:'尺',      e:'📏', gaps:[1,3], extra:['o','a','i'], tip:'ruler：r-u-l-e-r，u 在 l 的前面。'}
];
const SCH_POSS = [
  {s:'I',    p:'my',    zh:'我 → 我的',     who:'I',           bad:['me','mine']},
  {s:'you',  p:'your',  zh:'你 → 你的',     who:'You',         bad:["you're",'you']},
  {s:'he',   p:'his',   zh:'他 → 他的',     who:'Tom',         bad:["he's",'him']},
  {s:'she',  p:'her',   zh:'她 → 她的',     who:'Amy',         bad:["she's",'she']},
  {s:'we',   p:'our',   zh:'我們 → 我們的', who:'We',          bad:["we're",'us']},
  {s:'they', p:'their', zh:'他們 → 他們的', who:'Tom and Amy', bad:["they're",'there']}
];
const SCH_ORDER = [
  ["Is this your pencil?","這是你的鉛筆嗎？",["you're"]],
  ["Is that his book?","那是他的書嗎？",["he's"]],
  ["Is this her ruler?","這是她的尺嗎？",["she's"]],
  ["Is that your pen?","那是你的原子筆嗎？",["you're"]],
  ["Is this my eraser?","這是我的橡皮擦嗎？",["me"]],
  ["Is that her marker?","那是她的彩色筆嗎？",["she's"]],
  ["Yes, it is.","是的，它是。",[]],
  ["No, it's not.","不，它不是。",["its"]],
  ["It's my pencil.","這是我的鉛筆。",["me"]],
  ["It's his book.","這是他的書。",["he's"]],
  ["It's her ruler.","這是她的尺。",["she"]],
  ["It's your pen.","這是你的原子筆。",["you're"]]
];
const schOrderTip = s => /^Is /.test(s) ? '問句順序：Is → this / that → 誰的 → 東西 → ?'
  : /^It's/.test(s) ? "回答順序：It's → 誰的 → 東西。It's = It is，要有撇。"
  : "回答：Yes, it is. 或 No, it's not.（it's = it is）。";
const SCH = {
  name:'學校 Unit 3', sub:'文具・this / that', cls:'teal',
  desc:{words:'pen、pencil、marker、eraser、book、ruler', grammar:'Is this your pencil? ・ 所有格', contr:"it's、isn't、their / they're", paper:'聽 iPad 念，寫在紙上'},

const UNITS = {school3:SCH, care3:C3, care4:C4};

/* ===================== 儲存 ===================== */
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
const todayKey = () => { const d=new Date(); return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`; };
let settings = Object.assign({slow:true}, store.get(KEY.settings, {}));
let errors = store.get(KEY.errors, []);
let cu = store.get(KEY.unit, 'school3'); if(!UNITS[cu]) cu='school3';
const newDay = () => ({date:todayKey(), prog:Object.fromEntries(Object.keys(UNITS).map(u=>[u, Object.fromEntries(MODE_KEYS.map(m=>[m,[]]))]))});
let day = store.get(KEY.day, null);
if(!day || day.date!==todayKey() || !day.prog) day = newDay();
Object.keys(UNITS).forEach(u=>{ day.prog[u]=day.prog[u]||{}; MODE_KEYS.forEach(m=>{ if(!Array.isArray(day.prog[u][m])) day.prog[u][m]=[]; }); });
const saveDay = () => store.set(KEY.day, day);
const saveErrors = () => store.set(KEY.errors, errors);

/* ===================== 發音 ===================== */
let voice=null;
function pickVoice(){
  if(!('speechSynthesis' in window)) return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]US/i.test(v.lang));
  voice = vs.find(v=>/Samantha/i.test(v.name)) || vs.find(v=>/Google US/i.test(v.name)) || vs[0] || null;
}
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function utter(text, rate){
  const u=new SpeechSynthesisUtterance(text.replace(/-/g,' '));
  u.lang='en-US'; if(voice) u.voice=voice; u.rate = rate || (settings.slow ? 0.75 : 0.95);
  return u;
}
function speak(text, rate){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); speechSynthesis.speak(utter(text, rate)); }catch(e){}
}
function speakSeq(list){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel(); list.forEach(t=>speechSynthesis.speak(utter(t))); }catch(e){}
}

/* ===================== 小工具 ===================== */
const $ = id => document.getElementById(id);
const rand = a => a[Math.floor(Math.random()*a.length)];
const randInt = (a,b) => a+Math.floor(Math.random()*(b-a+1));
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function el(tag, attrs={}, html=''){ const e=document.createElement(tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(html) e.innerHTML=html; return e; }
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/></svg>';
function speakBtn(text,label='聽發音'){ const b=el('button',{class:'speak',type:'button'},SPEAKER+label); b.onclick=()=>speak(text); return b; }
function slowBtn(text){ const b=el('button',{class:'speak',type:'button'},SPEAKER+'慢慢念'); b.onclick=()=>speak(text,0.45); return b; }

/* ===================== 出題 ===================== */
const itemOf = q => UNITS[q.u].banks[q.b][q.i];
const keyOf = q => `${q.u}|${q.b}|${q.i}`;
const TYPE_LABEL = {zhword:'中翻英', listenword:'聽一聽', gap:'挖空拼字', fill:'選選看', zhsent:'選出正確的句子', order:'排句子', find:'找錯', paper:'紙上聽寫'};

function pickItem(u, bankNames, used){
  const U=UNITS[u];
  for(let t=0;t<20;t++){
    const b=rand(bankNames), arr=U.banks[b], i=randInt(0,arr.length-1), key=`${u}|${b}|${i}`;
    if(!used.has(key)){ used.add(key); return {u,b,i}; }
  }
  const b=rand(bankNames); return {u,b,i:randInt(0,U.banks[b].length-1)};
}
function buildRound(u, mode, n){
  const U=UNITS[u], groups=U.groups[mode], used=new Set(), list=[];
  groups.forEach(([banks,c])=>{
    for(let k=0;k<c;k++){ const p=pickItem(u,banks,used); list.push({u:p.u, b:p.b, i:p.i, kind:U.banks[p.b][p.i].kind, banks}); }
  });
  const allBanks=new Set(groups.flatMap(g=>g[0]));
  errors.filter(e=>!e.fixed && e.u===u && allBanks.has(e.b) && U.banks[e.b] && U.banks[e.b][e.i])
    .sort((a,b)=>b.count-a.count).slice(0,MAX_REVIEW)
    .forEach(e=>{
      if(list.some(q=>keyOf(q)===e.key)) return;
      const idx=list.findIndex(q=>!q.review && q.banks.includes(e.b));
      if(idx>=0) list[idx]={u, b:e.b, i:e.i, kind:U.banks[e.b][e.i].kind, banks:list[idx].banks, review:true};
    });
  return shuffle(list).slice(0,n);
}

/* ===================== 答題流程 ===================== */
let session=null, qStart=0;
const R = () => day.prog[session.u][session.mode];
const cur = () => session.qs[session.i];

function startSession(mode){
  if(day.date!==todayKey()) day=newDay();
  if(day.prog[cu][mode].length>=ROUND) day.prog[cu][mode]=[];
  saveDay();
  session={u:cu, mode, qs:buildRound(cu, mode, ROUND - day.prog[cu][mode].length), i:0, streak:0, stars:0};
  show('quiz'); renderQ();
}

function renderQ(){
  const q=cur(), it=itemOf(q);
  $('q-type').textContent = `${UNITS[q.u].name}・${TYPE_LABEL[q.kind]}` + (q.review?'・複習':'');
  $('q-count').textContent = `${R().length+1} / ${ROUND}`;
  $('q-bar').style.width = (R().length/ROUND*100)+'%';
  $('q-stars').textContent = '★'.repeat(session.stars);
  const body=$('q-body'); body.innerHTML=''; body.classList.remove('pop'); void body.offsetWidth; body.classList.add('pop');
  if(q.tries===1) body.appendChild(hintCard(q,it));
  RENDER[q.kind](q, body, it);
  qStart=Date.now();
}

function hintFor(it){
  if(it.kind==='zhword') return '再看一次中文，想想看它的英文怎麼念、怎麼拼。';
  if(it.kind==='listenword') return '仔細聽，再聽一次。';
  return it.tip || '慢慢來，再看一次題目。';
}
function hintCard(q, it){
  const card=el('div',{class:'hintcard',role:'status'},`<b>再試一次</b><div>${hintFor(it)}</div>`);
  if(it.kind==='listenword' || it.kind==='gap'){
    const row=el('div',{class:'row'}); row.appendChild(speakBtn(it.say||it.target||it.a,'再聽一次')); card.appendChild(row);
  }
  return card;
}

// 所有題型作答都經過這裡：太快→提醒；第一次錯→提示再試；其他→結束這題
function answer(q, ok, given, aHTML, aText, note, opts={}){
  if(!opts.typed && Date.now()-qStart < TOO_FAST){
    const body=$('q-body');
    body.querySelectorAll('button, input').forEach(b=>b.disabled=true);
    body.prepend(el('div',{class:'nudge',role:'status'},'先看清楚再按喔，這題不算分。'));
    setTimeout(()=>{ if(session && cur() && !$('quiz').hidden) renderQ(); }, 1400);
    return 'fast';
  }
  if(!ok && !q.tries){ q.tries=1; q.firstGiven=given; renderQ(); return 'retry'; }
  finish(q, ok, given, aHTML, aText, note);
  return 'done';
}

function finish(q, ok, given, aHTML, aText, note){
  const body=$('q-body');
  body.querySelectorAll('button:not(.speak), input').forEach(b=>b.disabled=true);
  const res = ok ? (q.tries ? 'fix' : 'ok') : 'no';
  R().push(res); saveDay();
  logResult(q, res, given, aText);
  let star=false;
  if(res!=='no'){ session.streak++; if(session.streak%3===0){ session.stars++; star=true; } } else session.streak=0;
  $('q-stars').textContent = '★'.repeat(session.stars);
  const fb=el('div',{class:'feedback '+(res==='no'?'no':'ok'),role:'status'});
  const title = res==='ok' ? '答對了！' : res==='fix' ? '訂正成功！' : '沒關係，看一下正確答案';
  fb.innerHTML = `<h3>${title}</h3>${res==='ok'?'':'<div class="small">正確答案：</div>'}<div class="fb-answer">${aHTML}</div>${res!=='ok' && note ? `<div>${note}</div>`:''}${star?'<div class="starline">★ 連續答對 3 題，得到一顆星！</div>':''}`;
  const done = R().length>=ROUND || session.i>=session.qs.length-1;
  const next=el('button',{class:'big',type:'button'}, done?'看結果':'下一題');
  next.onclick=()=>{ session.i++; if(done) showResult(); else renderQ(); };
  fb.appendChild(next);
  body.appendChild(fb);
  speak(aText);
  fb.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function promptText(q){
  const it=itemOf(q);
  if(it.pt) return it.pt;
  switch(it.kind){
    case 'zhword': return `中翻英：${it.zh}`;
    case 'listenword': return `聽音選字`;
    case 'gap': return `拼字：${it.target}`;
    case 'fill': return it.s + (it.cue ? `（${it.cue}）` : '');
    case 'zhsent': return `中翻英：${it.zh}`;
    case 'order': return `排句子：${it.s}`;
    case 'find': return `找錯：${it.toks.join(' ')}`;
    case 'paper': return `紙上聽寫：${it.text}`;
  }
  return q.kind;
}
function logResult(q, res, given, aText){
  const key=keyOf(q);
  let e=errors.find(x=>x.key===key);
  if(q.tries || res==='no'){
    if(!e){ e={key,u:q.u,b:q.b,i:q.i,prompt:promptText(q),answer:aText,given:'',count:0,fixed:false}; errors.unshift(e); }
    e.count++; e.given=(q.firstGiven ?? given) || '（沒有作答）'; e.fixed = res==='fix'; e.last=todayKey();
  } else if(e){ e.fixed=true; e.last=todayKey(); }
  if(errors.length>200) errors.length=200;
  saveErrors();
}

/* ---------- 共用元件 ---------- */
function mkPrompt(body){ const p=el('div',{class:'prompt'}); body.appendChild(p); return p; }
// 選擇題：opts = [{label, value}]；onPick(value) 回傳 answer() 的結果
function mcq(body, opts, correctVal, onPick){
  const long = opts.some(o=>String(o.label).length>16);
  const grid=el('div',{class:'options'+(long?' one':(opts.length===3?' three':''))});
  shuffle(opts).forEach(o=>{
    const b=el('button',{class:'opt',type:'button'}, esc(o.label));
    b.dataset.v=o.value;
    b.onclick=()=>{
      const r=onPick(o.value);
      if(r==='done'){
        b.classList.add(o.value===correctVal?'right':'wrong');
        if(o.value!==correctVal) [...grid.children].find(c=>c.dataset.v===correctVal)?.classList.add('right');
      }
    };
    grid.appendChild(b);
  });
  body.appendChild(grid);
  return grid;
}
// 方塊組合題
function tileBuilder(body, tiles, onSubmit, {cls='tile', placeholder='點下面的方塊'}={}){
  const slots=el('div',{class:'slots','aria-label':'你的答案'});
  const box=el('div',{class:'tiles'});
  const picked=[];
  const draw=()=>{
    slots.innerHTML='';
    if(!picked.length) slots.appendChild(el('span',{class:'placeholder'},placeholder));
    picked.forEach((ti,pi)=>{ const b=el('button',{class:cls,type:'button','aria-label':'移除 '+tiles[ti]},esc(tiles[ti])); b.onclick=()=>{picked.splice(pi,1);draw();}; slots.appendChild(b); });
    [...box.children].forEach((b,i)=>b.disabled=picked.includes(i));
  };
  tiles.forEach((t,i)=>{ const b=el('button',{class:cls,type:'button'},esc(t)); b.onclick=()=>{picked.push(i);draw();}; box.appendChild(b); });
  body.append(slots,box);
  const row=el('div',{class:'row center'});
  const clr=el('button',{class:'ghost',type:'button'},'清除'); clr.onclick=()=>{picked.length=0;draw();};
  const ok=el('button',{class:'big',type:'button'},'確認');
  ok.onclick=()=>{ if(!picked.length) return; onSubmit(picked.map(i=>tiles[i])); };
  row.append(clr,ok); body.appendChild(row);
  draw();
}
// 挖空作答：點字卡依序填入空格；點已填的空格可以拿回來
function gapUI(body, {pre='', target, post='', blanks, extra}, onDone){
  const line=el('div',{class:'gapline'});
  if(pre) line.appendChild(el('span',{class:'cell word'},esc(pre)));
  const cells=[];
  [...target].forEach((ch,i)=>{
    if(ch===' '){ line.appendChild(el('span',{class:'spacer'})); return; }
    if(blanks.includes(i)){ const b=el('button',{class:'cell blank',type:'button','aria-label':'空格'}); cells.push({i,b,card:null}); line.appendChild(b); }
    else line.appendChild(el('span',{class:'cell given'},esc(ch)));
  });
  if(post) line.appendChild(el('span',{class:'cell word'},esc(post)));
  body.appendChild(line);
  const cards=shuffle(blanks.map(i=>target[i]).concat(extra));
  const box=el('div',{class:'tiles'});
  const cardBtns=cards.map(ch=>{ const b=el('button',{class:'tile',type:'button'},esc(ch)); box.appendChild(b); return b; });
  body.appendChild(box);
  const set=(c,k)=>{ c.card=k; c.b.textContent = k===null ? '' : cards[k]; c.b.className='cell '+(k===null?'blank':'filled'); };
  cardBtns.forEach((b,k)=>b.onclick=()=>{ const c=cells.find(x=>x.card===null); if(!c) return; set(c,k); b.disabled=true; });
  cells.forEach(c=>c.b.onclick=()=>{ if(c.card===null) return; cardBtns[c.card].disabled=false; set(c,null); });
  const row=el('div',{class:'row center'});
  const clr=el('button',{class:'ghost',type:'button'},'清除');
  clr.onclick=()=>cells.forEach(c=>{ if(c.card!==null){ cardBtns[c.card].disabled=false; set(c,null); } });
  const ok=el('button',{class:'big',type:'button'},'確認');
  ok.onclick=()=>{
    if(cells.some(c=>c.card===null)) return;
    const arr=[...target]; cells.forEach(c=>arr[c.i]=cards[c.card]);
    onDone(arr.join(''));
  };
  row.append(clr,ok); body.appendChild(row);
}
function sentenceHTML(parts){ // ___ 變成空格；已給的字用灰色
  return parts.split('___').map(s=>`<span class="given">${esc(s)}</span>`).join('<span class="blank"></span>');
}

/* ---------- 各題型 ---------- */
const RENDER = {
  // 看中文，選英文單字 / 片語
  zhword(q, body, it){
    const pr=mkPrompt(body);
    if(it.e) pr.appendChild(el('div',{class:'emoji'},it.e));
    pr.appendChild(el('div',{class:'zhbig'},esc(it.zh)));
    pr.appendChild(el('div',{class:'zh'},'選出正確的英文'));
    const opts=[it.a].concat(shuffle(it.pool.filter(x=>x!==it.a)).slice(0,2));
    mcq(body, opts.map(x=>({value:x,label:x})), it.a,
      v=>answer(q, v===it.a, v, `${esc(it.a)} <span class="muted small">（${esc(it.zh)}）</span>`, it.a, it.tip));
  },
  // 聽發音，選單字
  listenword(q, body, it){
    const pr=mkPrompt(body);
    pr.appendChild(el('div',{class:'zh'},'聽發音，選出正確的單字'));
    const row=el('div',{class:'row center'}); row.append(speakBtn(it.a,'再聽一次'), slowBtn(it.a)); pr.appendChild(row);
    const opts=[it.a].concat(shuffle(it.pool.filter(x=>x!==it.a)).slice(0,2));
    mcq(body, opts.map(x=>({value:x,label:x})), it.a,
      v=>answer(q, v===it.a, v, esc(it.a), it.a, it.tip));
    setTimeout(()=>speak(it.a),300);
  },
  // 挖空拼字 / 補撇
  gap(q, body, it){
    const pr=mkPrompt(body);
    if(it.e) pr.appendChild(el('div',{class:'emoji'},it.e));
    pr.appendChild(el('div',{class:'zh'},`${it.zh ? it.zh+'・' : ''}補上缺的字母或符號`));
    pr.appendChild(speakBtn(it.say||it.target));
    gapUI(body, {target:it.target, blanks:it.blanks, extra:it.extra, pre:it.pre||'', post:it.post||''}, filled=>
      answer(q, filled===it.target, filled, esc(it.target), it.say||it.target, it.tip));
  },
  // 句子填空（選擇）
  fill(q, body, it){
    const pr=mkPrompt(body);
    if(it.cue) pr.appendChild(el('div',{class:'cue'},esc(it.cue)));
    pr.appendChild(el('div',{class:'sentence'+(it.big?' sbig':'')}, sentenceHTML(it.s)));
    if(it.zh) pr.appendChild(el('div',{class:'zh'},esc(it.zh)));
    const full=it.s.replace('___',it.a);
    mcq(body, [it.a].concat(it.bad).map(x=>({value:x,label:x})), it.a,
      v=>answer(q, v===it.a, v, esc(full), it.say||full, it.tip));
  },
  // 看中文，選正確的英文句子
  zhsent(q, body, it){
    const pr=mkPrompt(body);
    pr.appendChild(el('div',{class:'sentence'},esc(it.zh)));
    pr.appendChild(el('div',{class:'zh'},'選出正確的英文句子'));
    mcq(body, [it.a].concat(it.bad).map(x=>({value:x,label:x})), it.a,
      v=>answer(q, v===it.a, v, esc(it.a), it.a, it.tip));
  },
  // 排字卡
  order(q, body, it){
    const pr=mkPrompt(body);
    if(it.zh) pr.appendChild(el('div',{class:'sentence'},esc(it.zh)));
    pr.appendChild(el('div',{class:'zh'},'把字卡排成英文（句首大寫、句尾有標點）。有的字卡用不到。'));
    const words=it.s.split(' '), extra=it.extra||[];
    let tiles=shuffle(words.concat(extra)), guard=0;
    while(tiles.filter(t=>!extra.includes(t)).join(' ')===it.s && guard++<10) tiles=shuffle(tiles);
    tileBuilder(body, tiles, parts=>{
      const g=parts.join(' ');
      let note=it.tip||'';
      if(g!==it.s && parts.some(p=>extra.includes(p))) note='有一塊字卡不是這句話要用的。'+note;
      else if(g!==it.s && parts.length<words.length) note='還有字卡沒有排進去。'+note;
      answer(q, g===it.s, g, esc(it.s), it.s, note);
    }, {cls:'tile word', placeholder:'依序點下面的字卡'});
  },
  // 找出句子裡錯的地方
  find(q, body, it){
    const pr=mkPrompt(body);
    pr.appendChild(el('div',{class:'zh'},'這句話有一個地方錯了，點出來'));
    const line=el('div',{class:'findline'});
    it.toks.forEach((t,i)=>{
      const punct=/^[.,?!]$/.test(t);
      const b=el('button',{class:'tok'+(t.length<=1?' tight':'')+((!punct&&i>0)?' gap':''),type:'button'},esc(t));
      b.onclick=()=>{
        const r=answer(q, i===it.wrong, t, esc(it.fixed), it.fixed, it.tip);
        if(r==='done'){ b.classList.add(i===it.wrong?'right':'wrong'); if(i!==it.wrong) line.children[it.wrong].classList.add('right'); }
      };
      line.appendChild(b);
    });
    body.appendChild(line);
  },
  // 紙上聽寫
  paper(q, body, it){
    const text=it.text, isWord=!/[.?!]$/.test(text);
    const pr=mkPrompt(body);
    pr.appendChild(el('div',{class:'sentence'}, isWord ? '聽寫一個單字' : '聽寫一個句子'));
    pr.appendChild(el('div',{class:'zh'}, isWord ? '仔細聽，把英文寫在紙上' : '仔細聽，把整個句子寫在紙上（大寫開頭、記得縮寫的撇和標點）'));
    const row=el('div',{class:'row center'}); row.append(speakBtn(text,'再聽一次'), slowBtn(text)); pr.appendChild(row);
    const box=el('div',{class:'paperbox'},'寫好了再按下面的按鈕');
    body.appendChild(box);
    const reveal=el('button',{class:'big',type:'button'},'寫好了，看答案');
    const rrow=el('div',{class:'row center'}); rrow.appendChild(reveal); body.appendChild(rrow);
    reveal.onclick=()=>{
      rrow.remove();
      box.innerHTML=`<div class="small">正確答案</div><div class="fb-answer" style="color:var(--ink)">${esc(text)}</div><div class="small" style="margin-top:6px">跟紙上的比一比，一個字母、一個撇一個撇看</div>`;
      const g=el('div',{class:'options'});
      const yes=el('button',{class:'opt',type:'button'},'寫對了');
      const no=el('button',{class:'opt',type:'button'},'寫錯了');
      yes.onclick=()=>{ yes.classList.add('right'); finish(q, true, '紙上寫對', esc(text), text, ''); };
      no.onclick=()=>{ no.classList.add('wrong'); finish(q, false, '紙上寫錯', esc(text), text, it.tip); };
      g.append(yes,no); body.appendChild(g);
    };
    setTimeout(()=>speak(text),300);
  }
};

/* ===================== 畫面 ===================== */
const SCREENS=['home','home-notes','quiz','result','errors','settings'];
function show(name){
  SCREENS.forEach(s=>$(s).hidden=true);
  if(name==='home'){ $('home').hidden=false; $('home-notes').hidden=false; renderHome(); }
  else $(name).hidden=false;
  $('nav-home').setAttribute('aria-current', String(['home','quiz','result'].includes(name)));
  $('nav-errors').setAttribute('aria-current', String(name==='errors'));
  $('nav-settings').setAttribute('aria-current', String(name==='settings'));
  if(name==='errors') renderErrors();
  window.scrollTo(0,0);
}
function dots(target, arr){
  target.innerHTML='';
  for(let i=0;i<ROUND;i++){ const r=arr[i]; target.appendChild(el('span',{class:'dot'+(r?' '+r:'')})); }
}
function renderHome(){
  if(day.date!==todayKey()){ day=newDay(); saveDay(); }
  const U=UNITS[cu];
  const tabs=$('unit-tabs'); tabs.innerHTML='';
  Object.keys(UNITS).forEach(u=>{
    const b=el('button',{class:'unitbtn',type:'button',role:'tab','aria-selected':String(u===cu)},`${esc(UNITS[u].name)}<small>${esc(UNITS[u].sub)}</small>`);
    b.onclick=()=>{ cu=u; store.set(KEY.unit,u); renderHome(); };
    tabs.appendChild(b);
  });
  const box=$('modes'); box.innerHTML='';
  MODE_KEYS.forEach(m=>{
    const arr=day.prog[cu][m], done=arr.length, right=arr.filter(x=>x!=='no').length, info=MODE_INFO[m];
    const status = done===0 ? `${U.desc[m]}，${ROUND} 題` : done<ROUND ? `做了 ${done} 題，還有 ${ROUND-done} 題` : `完成了！${right} / ${ROUND} 題答對或訂正`;
    const row=el('div',{class:'mode'});
    const left=el('div',{class:'mode-info'},
      `<h3>${info.badge?`<span class="badge" style="background:var(${info.color})">${info.badge}</span>`:''}${info.name}</h3><p class="muted small">${esc(status)}</p>`);
    const d=el('div',{class:'dots'}); dots(d,arr); left.appendChild(d);
    const btn=el('button',{class:'big '+U.cls,type:'button'}, done===0?'開始':done<ROUND?'繼續':'再一回');
    btn.onclick=()=>startSession(m);
    row.append(left,btn); box.appendChild(row);
  });
  renderNotes(U);
}
function renderNotes(U){
  const n=$('home-notes'); n.innerHTML='';
  n.appendChild(el('h3',{},`${esc(U.name)}　重點整理`));
  n.appendChild(el('p',{class:'small muted'},'點一下可以聽發音。'));
  const chips=el('div',{class:'chips'});
  U.vocab.forEach(v=>{ const c=el('button',{class:'chip',type:'button'},`${v.e?v.e+' ':''}<b>${esc(v.w)}</b><span class="muted">${esc(v.zh)}</span>`); c.onclick=()=>speak(v.w); chips.appendChild(c); });
  n.appendChild(chips);
  n.appendChild(el('h3',{},'句型'));
  U.sentences.forEach(s=>{ const b=el('button',{class:'sline',type:'button'},esc(s)); b.onclick=()=>speak(s); n.appendChild(b); });
  n.appendChild(el('h3',{},esc(U.pairsTitle)));
  const pairs=el('div',{class:'pairs'});
  U.pairs.forEach(([a,b])=>{ const p=el('button',{class:'pair',type:'button'},`<span>${esc(a)}</span><span>→ <b>${esc(b)}</b></span>`); p.onclick=()=>speakSeq([a,b]); pairs.appendChild(p); });
  n.appendChild(pairs);
  U.notes.forEach(x=>{ n.appendChild(el('h3',{},esc(x.h))); n.appendChild(el('p',{},x.html)); });
}
function showResult(){
  const arr=R(), ok=arr.filter(x=>x==='ok').length, fix=arr.filter(x=>x==='fix').length, no=arr.filter(x=>x==='no').length;
  $('r-title').textContent = no===0 ? '全部完成，很棒！' : '完成這一回了！';
  $('r-sub').textContent = `一次答對 ${ok} 題，訂正 ${fix} 題` + (no ? `，還要再練 ${no} 題（之後會再出現）` : '') + (session.stars ? `。得到 ${session.stars} 顆星 ★` : '。');
  dots($('r-dots'), arr);
  show('result');
}
function renderErrors(){
  const tb=$('e-body'); tb.innerHTML='';
  $('e-empty').hidden = errors.length>0;
  const stats=$('e-stats'); stats.innerHTML='';
  const open=errors.filter(e=>!e.fixed);
  stats.appendChild(el('div',{class:'stat'},`待訂正<b>${open.length}</b>`));
  stats.appendChild(el('div',{class:'stat'},`已訂正<b>${errors.length-open.length}</b>`));
  Object.keys(UNITS).forEach(u=>{ const c=open.filter(e=>e.u===u).length; if(c) stats.appendChild(el('div',{class:'stat'},`${esc(UNITS[u].name)}<b>${c}</b>`)); });
  errors.slice().sort((a,b)=>(a.fixed-b.fixed)||(b.count-a.count)).forEach(e=>{
    const tr=el('tr');
    tr.innerHTML=`<td>${esc(UNITS[e.u] ? UNITS[e.u].name : e.u)}</td><td>${esc(e.prompt)}</td><td>${esc(e.given)}</td><td><b>${esc(e.answer)}</b></td><td>${e.count}</td><td><span class="pill ${e.fixed?'fixed':'open'}">${e.fixed?'已訂正':'待訂正'}</span></td>`;
    tb.appendChild(tr);
  });
  resetClearZone();
  $('e-clear-zone').hidden = errors.length===0;
}
function resetClearZone(){
  const z=$('e-clear-zone'); z.innerHTML='';
  const b=el('button',{class:'ghost',type:'button',id:'e-clear'},'清除所有紀錄');
  b.onclick=()=>{
    z.innerHTML='';
    const box=el('div',{class:'confirm'},'<span>確定要清除所有錯題紀錄嗎？</span>');
    const yes=el('button',{class:'ghost',type:'button'},'清除'); const no=el('button',{class:'ghost',type:'button'},'取消');
    yes.onclick=()=>{ errors=[]; saveErrors(); renderErrors(); };
    no.onclick=resetClearZone;
    box.append(yes,no); z.appendChild(box);
  };
  z.appendChild(b);
}

/* ===================== 啟動 ===================== */
// 只留下題庫裡還存在的錯題
errors = errors.filter(e=>UNITS[e.u] && UNITS[e.u].banks[e.b] && UNITS[e.u].banks[e.b][e.i]); saveErrors();
$('nav-home').onclick=()=>show('home');
$('nav-errors').onclick=()=>show('errors');
$('nav-settings').onclick=()=>show('settings');
$('r-home').onclick=()=>show('home');
$('r-again').onclick=()=>startSession(session.mode);
$('s-rate').checked=settings.slow;
$('s-rate').onchange=e=>{settings.slow=e.target.checked;store.set(KEY.settings,settings);};
$('s-test').onclick=()=>speakSeq(["He's watching a movie.","They aren't watching a movie."]);
$('s-reset-day').onclick=()=>{ day=newDay(); saveDay(); show('home'); };
show('home');
</script>
